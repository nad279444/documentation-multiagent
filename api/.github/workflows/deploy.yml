name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to mint the OIDC token for Workload Identity Federation
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Debug secrets presence
        run: |
          if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then echo "WIF_PROVIDER is EMPTY"; else echo "WIF_PROVIDER is set"; fi
          if [ -z "${{ secrets.GCP_SA_EMAIL }}" ]; then echo "GCP_SA_EMAIL is EMPTY"; else echo "GCP_SA_EMAIL is set"; fi
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 363.0.0"

      - name: Build and push image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/doc-agent-starter

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy doc-agent-starter \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/doc-agent-starter \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest
